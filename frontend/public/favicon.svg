<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Shield Fill -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Checkmark Glow Gradient -->
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Subtle Forensic Scan Grid lines -->
  <path d="M 64 256 L 448 256 M 256 64 L 256 448" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.3"/>

  <!-- Outer Glowing Shield Outline -->
  <path d="M 256 80 L 400 136 C 400 280 340 388 256 432 C 172 388 112 280 112 136 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldBorder)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Tech Arc Lines -->
  <path d="M 256 120 L 370 164 C 370 280 320 360 256 400 C 192 360 142 280 142 164 Z" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="4" 
        stroke-dasharray="12 6" 
        opacity="0.5"/>

  <!-- Central Verification Checkmark Symbol -->
  <path d="M 196 256 L 238 298 L 320 200" 
        fill="none" 
        stroke="url(#checkGradient)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Forensic AI Nodes / Orbs -->
  <circle cx="256" cy="120" r="8" fill="#38bdf8"/>
  <circle cx="370" cy="164" r="6" fill="#818cf8"/>
  <circle cx="142" cy="164" r="6" fill="#818cf8"/>
  <circle cx="256" cy="400" r="7" fill="#34d399"/>
</svg>
